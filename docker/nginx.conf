server {
    listen 80;
    server_name localhost;

    # Frontend SPA routing fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy with Server-Sent Events (SSE) support
    location /api {
        proxy_pass http://api:8100;

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and caching for SSE streaming responses
        proxy_buffering off;
        proxy_cache off;

        # HTTP/1.1 and keep-alive for persistent SSE connection
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # Extended timeouts for long-running LLM generation SSE streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
