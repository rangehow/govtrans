version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: govtrans-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govtrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govtrans}
      POSTGRES_DB: ${POSTGRES_DB:-govtrans}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-govtrans} -d ${POSTGRES_DB:-govtrans}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: govtrans-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: govtrans-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-govtrans}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-.env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: govtrans-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-govtrans} ${MINIO_ROOT_PASSWORD:-change-me-in-.env} &&
      mc mb --ignore-existing myminio/${S3_BUCKET:-govtrans-corpus} &&
      echo 'MinIO bucket initialization completed.'
      "

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: govtrans-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-govtrans}:${POSTGRES_PASSWORD:-govtrans}@db:5432/${POSTGRES_DB:-govtrans}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      TOFU_BASE_URL: http://tofu:15000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8100:8100"
    command: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8100"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8100/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: govtrans-web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  tofu:
    profiles:
      - tofu
    build:
      # ToFu source code is located outside the GovTrans repository.
      # You can also run it directly on the host machine using `python server.py` at port 15000.
      context: ${TOFU_CONTEXT:-../chatui}
    container_name: govtrans-tofu
    ports:
      - "15000:15000"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
