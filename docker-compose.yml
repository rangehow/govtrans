name: govtrans

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govtrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/deploy.sh init first}
      POSTGRES_DB: ${POSTGRES_DB:-govtrans}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  tofu:
    build:
      context: .
      dockerfile: docker/tofu-agent.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    init: true
    environment:
      TOFU_AGENT_HOST: 0.0.0.0
      TOFU_AGENT_PORT: 15001
      TOFU_AGENT_TOKEN: ${TOFU_API_KEY:?Run ./scripts/deploy.sh init first}
      TOFU_AGENT_SETUP_ENABLED: "0"
      TOFU_AGENT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOFU_AGENT_MAX_INFLIGHT: ${TOFU_MAX_CONCURRENCY:-6}
      TOFU_AGENT_PROVIDER_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      TOFU_AGENT_PROVIDER_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY in .env}
      TOFU_AGENT_PROVIDER_MODEL: ${FAST_MODEL:-qwen-turbo}
    ports:
      - "127.0.0.1:${TOFU_PORT:-15001}:15001"
    mem_limit: ${TOFU_MEMORY_LIMIT:-4g}
    pids_limit: ${TOFU_PIDS_LIMIT:-512}
    stop_grace_period: 45s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - .env
    environment:
      GOVTRANS_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-govtrans}:${POSTGRES_PASSWORD:?Run ./scripts/deploy.sh init first}@db:5432/${POSTGRES_DB:-govtrans}
      TOFU_BASE_URL: http://tofu:15001
      TOFU_API_KEY: ${TOFU_API_KEY:?Run ./scripts/deploy.sh init first}
    depends_on:
      db:
        condition: service_healthy
      tofu:
        condition: service_healthy
    expose:
      - "8100"
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8100"
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec python -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8100
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    stop_grace_period: 45s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "${GOVTRANS_BIND_ADDRESS:-0.0.0.0}:${GOVTRANS_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
